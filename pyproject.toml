[project]
name = "connect4-robot"
version = "1.1.0"
description = "Vision-guided Connect-4 robot: board reading, trusted-state validation, minimax, and camera-verified token placement."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "numpy",
    "opencv-python-headless>=4.8,<5",  # deployed on OpenCV 4.x (MS4/5 report)
    "pyserial",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
notebook = [
    "ipykernel",
    "matplotlib",
    "nbconvert",
]

[project.scripts]
connect4-robot = "connect4_robot.dashboard:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "14 days"

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "ERA", "BLE", "S", "PLW"]
ignore = ["S301"]  # pickle: the model file is produced locally by train_cell_model.py

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
